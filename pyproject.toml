[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-shire"
dynamic = ["version"]
description = "An observability platform for always-on laptops and power users. If you can script it, Shire can watch it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "jsonschema>=4.18", "Flask>=3", "waitress>=3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shire = "shire.cli:main"

# The version number lives in one place.
[tool.hatch.version]
path = "src/shire/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/shire"]
# The built page isn't in git, and still travels inside the package.
artifacts = ["src/shire/page/**"]

# The built-in plugins sit at the top of the repo, where they're easy to read,
# and travel inside the package when it's installed.
[tool.hatch.build.targets.wheel.force-include]
"plugins" = "shire/builtin_plugins"

[tool.pytest.ini_options]
testpaths = ["tests"]
